name: map
description: Local map utilities
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_map_marker_popup: ^8.1.0
  flutter_map_dragmarker: ^8.0.3
  flutter_map_line_editor: ^8.0.0
  latlong2: ^0.9.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  geolocator: ^13.0.1
  flutter_compass: ^0.8.0
  permission_handler: ^11.3.0
  location: ^6.0.2
  geodesy: ^0.10.2

dependency_overrides:
  permission_handler: ^11.3.0
  permission_handler_android: ">=11.0.0 <13.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/compass.png
    - fonts/DroneIcon.ttf

  fonts:
    - family: DroneIcon
      fonts:
        - asset: fonts/DroneIcon.ttf

  module:
    androidX: true
    androidPackage: com.example.flutter_module
    iosBundleIdentifier: com.example.flutterModule
