name: pointdefence
description: A new Flutter project
publish_to: "none" # optional, if not publishing to pub.dev

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  map:
    path: map
  flutter_bloc: ^8.0.1
  equatable: ^2.0.3
  fluttericon: ^2.0.0
  flutter_map: ^8.2.2
  flutter_map_marker_popup: ^8.1.0
  flutter_map_dragmarker: ^8.0.3
  flutter_map_line_editor: ^8.0.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/compass.png

dependency_overrides:
  geodesy: ^0.10.2
