allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// Ensure AGP 8+ namespace requirement is satisfied for third-party Android library modules
subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt != null) {
            def hasNsProp = androidExt.hasProperty('namespace')
            def currentNs = hasNsProp ? androidExt.getProperty('namespace') : null
            if (hasNsProp && (currentNs == null || currentNs.toString().trim().isEmpty())) {
                def safeModule = subproject.name.replaceAll('[^A-Za-z0-9_]', '_')
                androidExt.namespace = "dsta.c3d.pointdefence.${safeModule}"
            }
        }
    }
}